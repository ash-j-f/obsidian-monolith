        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;

        position: fixed;
        inset: 0;

        place-items: center;
        background: #17120c;

      #veil.gone {
        opacity: 0;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(26px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 12px 20px;
        border-radius: 8px;
        background: rgba(24, 16, 8, 0.56);
        color: var(--ink);
        text-align: center;
        font-size: 16px;
        line-height: 1.45;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.6s ease;
      }
      #hint.shown {
        opacity: 1;
        transition-delay: 1.8s;
      }
      #hint.gone {
        opacity: 0;
        transition-delay: 0s;
      }
      #hint small {
        display: block;
        margin-top: 2px;
        font-size: 14px;
        color: var(--ink-soft);
      }

         and the size doesn't jump when one is turned. Computers stay at the largest size. */
      #controls {
        position: fixed;
        right: calc(clamp(10px, 3.4vmin, 20px) + env(safe-area-inset-right));
        bottom: calc(clamp(10px, 3.4vmin, 20px) + env(safe-area-inset-bottom));
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: clamp(8px, 2.2vmin, 10px);
        max-width: calc(100vw - 20px);
        pointer-events: none;
      }
      .control {
        position: relative;
        display: none;
        min-height: clamp(28px, 8vmin, 44px);
        padding: 0 clamp(10px, 3vmin, 20px);
        border: 1px solid rgba(255, 228, 170, 0.5);
        border-radius: 22px;
        background: rgba(24, 16, 8, 0.62);
        color: var(--ink);
        font: italic clamp(12px, 3.2vmin, 16px) var(--serif);
        letter-spacing: 0.03em;
        white-space: nowrap;

      }
      .control.shown {
        display: block;
        opacity: 1;
      }
      @starting-style {
        .control.shown {
          opacity: 0;
        }
      }
      /* Up in the sky, because it's always there, and at the bottom it would sit under the opening
         hint on a phone. */
      #fullscreen {
        position: fixed;
        top: calc(clamp(10px, 3.4vmin, 20px) + env(safe-area-inset-top));

      }

      .control::after {
        content: '';
        position: absolute;
        inset: calc((clamp(28px, 8vmin, 44px) - 44px) / 2) -3px;
      }
      .control:hover {
        background: rgba(60, 40, 18, 0.8);
      }
      .control:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

// A tapering slab with generously rounded vertical corners: the roundness is what lets one
// edge catch the sun in a long, thin line. Its top is cut at a slant, like a blade.
function addMonolith(b, P, uvOf) {
  const corner = 0.4;
  const topRadius = 0.28;
  const k = 10;
  const quarter = Math.PI / 2;
  const signs = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
  const tiltX = (MONOLITH.w / 2) * MONOLITH.taper / MONOLITH.h;
  const tiltZ = (MONOLITH.t / 2) * MONOLITH.taper * 0.5 / MONOLITH.h;
  const topNormal = normalize([-MONOLITH.slant, 1, 0]);
  const yBase = -6;

  const section = (yGuess, inset) => {
    const hw = monolithHalfW(yGuess) - inset;
    const ht = monolithHalfT(yGuess) - inset;
    const r = Math.max(corner - inset, 0.001);
    const points = [];
    signs.forEach(([sx, sz], c) => {
      for (let i = 0; i <= k; i++) {
        const a = (c + i / k) * quarter;
        points.push({
          x: sx * (hw - r) + Math.cos(a) * r,
          z: sz * (ht - r) + Math.sin(a) * r,
          cos: Math.cos(a),
          sin: Math.sin(a),
        });
      }
    });
    return points;
  };

  const vertex = (pt, y, normal) => {
    const front = normal[2] > 0.98;
    return {
      p: P.point([pt.x, y, pt.z]),
      n: P.vector(normal),
      uv: uvOf(pt.x, y),
      orn: front ? 1 : 0,
      edge: 1,
    };
  };

  const rings = [];
  const yTop = MONOLITH.h - topRadius;
  for (const f of [0, 0.3, 0.6, 1]) {
    const yGuess = yBase + (yTop - yBase) * f;
    rings.push(
      section(yGuess, 0).map((pt) => {
        const y = yBase + (monolithTop(pt.x) - topRadius - yBase) * f;
        const normal = normalize([pt.cos, Math.abs(pt.cos) * tiltX + Math.abs(pt.sin) * tiltZ, pt.sin]);
        return vertex(pt, y, normal);
      }),
    );
  }
  const bevelSteps = 6;
  for (let j = 1; j <= bevelSteps; j++) {
    const a = (j / bevelSteps) * quarter;
    const inset = topRadius * (1 - Math.cos(a));
    rings.push(
      section(MONOLITH.h, inset).map((pt) => {
        const y = monolithTop(pt.x) - topRadius + topRadius * Math.sin(a);
        const h = [pt.cos, 0, pt.sin];
        const normal = normalize([
          h[0] * Math.cos(a) + topNormal[0] * Math.sin(a),
          topNormal[1] * Math.sin(a),
          h[2] * Math.cos(a),
        ]);
        return vertex(pt, y, normal);
      }),
    );
  }
  for (let r = 0; r < rings.length - 1; r++) {
    const lo = rings[r];
    const hi = rings[r + 1];
    for (let i = 0; i < lo.length; i++) {
      const n = (i + 1) % lo.length;
      b.quad(lo[i], lo[n], hi[i], hi[n]);
    }
  }
  const cap = rings[rings.length - 1];
  const centre = { p: P.point([0, monolithTop(0), 0]), n: P.vector(topNormal), edge: 1 };
  for (let i = 0; i < cap.length; i++) b.tri(cap[i], cap[(i + 1) % cap.length], centre);
}

// ── Ruins ─────────────────────────────────────────────────────────────────────────

// What is left of a monolith: polished faces below a jagged, rough-fractured break.
function addRuin(b, spec, P, uvOf) {
  const columns = 22;
  const depthSteps = 4;
  const { w, h, t, seed } = spec;
  const random = seededRandom(seed * 7919);
  const lean = (random() - 0.5) * 1.1;
  // However the break runs, it stays above every rune and gem on the stone, falling away either
  // side, so none of them is left hanging in the air when seen up close.
  const carried = (s) => {
    const x = (s - 0.5) * w;
    let top = 0;
    for (const e of spec.elements) {
      const reach = e.size * 1.5;
      const beyond = Math.max(Math.abs(x - e.u) - reach, 0);
      top = Math.max(top, e.v + reach + 0.1 - beyond * 1.1);
    }
    return top;
  };
  const profile = (s, side) => {
    const u = s * 2 - 1;
    const broad = noise2(s * 2.1 + seed, side * 0.6 + seed * 0.37) * 0.3;
    const teeth = noise2(s * 8.3 + seed * 3.1, side * 1.9) * 0.14 + noise2(s * 21 + seed, side * 3.7) * 0.05;
    const v = 0.72 + u * lean * 0.26 + broad + teeth;
    return Math.max(h * Math.max(0.38, Math.min(1.08, v)), carried(s) + teeth * 0.5);
  };
  const X = (i) => (i / columns - 0.5) * w;
  const front = [];
  const back = [];
  for (let i = 0; i <= columns; i++) {
    front.push(profile(i / columns, 0));
    back.push(profile(i / columns, 1) - 0.1 * h * random());
  }
  const yBase = -3;
  const faceN = P.vector([0, 0, 1]);
  const backN = P.vector([0, 0, -1]);
  const vert = (x, y, z, n, extra = {}) => ({ p: P.point([x, y, z]), n, ...extra });

  for (let i = 0; i < columns; i++) {
    const x0 = X(i);
    const x1 = X(i + 1);
    const orn = { orn: 1 };
    b.quad(
      vert(x0, yBase, t / 2, faceN, { uv: uvOf(x0, yBase), ...orn }),
      vert(x1, yBase, t / 2, faceN, { uv: uvOf(x1, yBase), ...orn }),
      vert(x0, front[i], t / 2, faceN, { uv: uvOf(x0, front[i]), ...orn }),
      vert(x1, front[i + 1], t / 2, faceN, { uv: uvOf(x1, front[i + 1]), ...orn }),
    );
    b.quad(
      vert(x1, yBase, -t / 2, backN),
      vert(x0, yBase, -t / 2, backN),
      vert(x1, back[i + 1], -t / 2, backN),
      vert(x0, back[i], -t / 2, backN),
    );
  }
  for (const [side, xs, ix] of [[1, w / 2, columns], [-1, -w / 2, 0]]) {
    const n = P.vector([side, 0, 0]);
    b.quad(
      vert(xs, yBase, t / 2, n),
      vert(xs, yBase, -t / 2, n),
      vert(xs, front[ix], t / 2, n),
      vert(xs, back[ix], -t / 2, n),
    );
  }

  // The fracture: faceted like knapped glass, so it glints in small flat planes.
  const heightAt = (i, j) => {
    const s = j / depthSteps;
    const base = front[i] + (back[i] - front[i]) * s;
    if (j === 0 || j === depthSteps) return base;
    return base + noise2(i * 0.9 + seed, j * 1.3 - seed) * 0.34 - 0.1;
  };
  const centre = P.point([0, 0, 0]);
  const rough = { rough: 1 };
  for (let i = 0; i < columns; i++) {
    for (let j = 0; j < depthSteps; j++) {
      const z0 = t / 2 - (j / depthSteps) * t;
      const z1 = t / 2 - ((j + 1) / depthSteps) * t;
      const a = P.point([X(i), heightAt(i, j), z0]);
      const c = P.point([X(i + 1), heightAt(i + 1, j), z0]);
      const d = P.point([X(i), heightAt(i, j + 1), z1]);
      const e = P.point([X(i + 1), heightAt(i + 1, j + 1), z1]);
      b.facet(a, c, d, centre, rough);
      b.facet(c, e, d, centre, rough);
    }
  }
}

// The orrery's stand: a short obsidian drum rising from the sand, cut off at the angle of its dial,
// with the polished dial plate on top. The moving parts are in orrery.js.
function addOrreryStand(b, P) {
  const segments = 40;
  const drum = 1.15 * ORRERY.scale;
  const radius = ORRERY.radius * ORRERY.scale;
  const { position: O, forward: n } = P;
  const planeY = (x, z) => O[1] - (n[0] * (x - O[0]) + n[2] * (z - O[2])) / n[1];
  const yBase = O[1] - ORRERY.height - 2;
  const around = (i) => (i / segments) * Math.PI * 2;
  for (let i = 0; i < segments; i++) {
    const a0 = around(i);
    const a1 = around(i + 1);
    const corner = (a, y) => {
      const x = O[0] + Math.cos(a) * drum;
      const z = O[2] + Math.sin(a) * drum;
      return { p: [x, y ?? planeY(x, z), z], n: [Math.cos(a), 0, Math.sin(a)] };
    };
    b.quad(corner(a0, yBase), corner(a1, yBase), corner(a0), corner(a1));

    // The plate's face, and the thin edge behind it.
    const onPlate = (a, z) => P.point([Math.sin(a) * radius, Math.cos(a) * radius, z]);
    const face = { n: P.forward };
    b.tri({ p: O, ...face }, { p: onPlate(a0, 0), ...face }, { p: onPlate(a1, 0), ...face });
    const edge = (a, z) => ({ p: onPlate(a, z), n: P.vector([Math.sin(a), Math.cos(a), 0]) });
    b.quad(edge(a0, 0), edge(a1, 0), edge(a0, -0.12), edge(a1, -0.12));
  }
}

// A half-buried shard of obsidian.
function addShard(b, x, y, z, sx, sy, sz, rotation, seed) {
  const random = seededRandom(seed);
  const rows = 4;
  const cols = 6;
  const P = placement([x, y, z], rotation, (random() - 0.5) * 0.7, (random() - 0.5) * 0.7);
  const grid = [];
  for (let j = 0; j <= rows; j++) {
    const row = [];
    const phi = (j / rows) * Math.PI;
    for (let i = 0; i < cols; i++) {
      const theta = (i / cols) * Math.PI * 2;
      const r = 0.72 + random() * 0.55;
      row.push(
        P.point([
          Math.sin(phi) * Math.cos(theta) * r * sx,
          Math.cos(phi) * r * sy,
          Math.sin(phi) * Math.sin(theta) * r * sz,
        ]),
      );
    }
    grid.push(row);
  }
  const centre = [x, y, z];
  const material = { rough: 0.32 };
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const n = (i + 1) % cols;
      const a = grid[j][i];
      const c = grid[j][n];
      const d = grid[j + 1][i];
      const e = grid[j + 1][n];
      if (j > 0) b.facet(a, c, d, centre, material);
      if (j < rows - 1) b.facet(c, e, d, centre, material);
    }
  }
}

// ── Engraving atlas ───────────────────────────────────────────────────────────────

// Thin inlaid lines that tie each stone's runes and gems together. The ruins carry the same
// lines, cut off where the stone broke.
function createAtlas(stones) {
  const canvas = document.createElement('canvas');
  canvas.width = ATLAS_SIZE;
  canvas.height = ATLAS_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, ATLAS_SIZE, ATLAS_SIZE);
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineCap = 'round';

  for (const stone of stones) {
    const { rect, elements } = stone;
    const px = (u) => rect.x + (u + rect.halfU) * rect.scale;
    const py = (v) => rect.y + (rect.maxV - v) * rect.scale;
    const line = (u0, v0, u1, v1, width = 0.05) => {
      ctx.lineWidth = width * rect.scale;
      ctx.beginPath();
      ctx.moveTo(px(u0), py(v0));
      ctx.lineTo(px(u1), py(v1));
      ctx.stroke();
    };
    const ringGap = (e) => e.size * 1.5;

    // Links between neighbouring elements, stopping short of their rings.
    const reach = stone.isMonolith ? 3.5 : 4.4;
    for (let i = 0; i < elements.length; i++) {
      for (let j = i + 1; j < elements.length; j++) {
        const a = elements[i];
        const c = elements[j];
        const d = Math.hypot(a.u - c.u, a.v - c.v);
        if (d > reach) continue;
        const dx = (c.u - a.u) / d;
        const dy = (c.v - a.v) / d;
        const ga = ringGap(a);
        const gc = ringGap(c);
        if (d <= ga + gc) continue;
        line(a.u + dx * ga, a.v + dy * ga, c.u - dx * gc, c.v - dy * gc);
      }
    }

    if (stone.isMonolith) {
      // A double border following the taper, with ticks counting up the stone.
      for (const side of [-1, 1]) {
        const steps = 30;
        for (let i = 0; i < steps; i++) {
          const y0 = 1 + (i / steps) * (MONOLITH.h - 1.5);
          const y1 = 1 + ((i + 1) / steps) * (MONOLITH.h - 1.5);
          line((monolithHalfW(y0) - 0.46) * side, y0, (monolithHalfW(y1) - 0.46) * side, y1, 0.05);
          line((monolithHalfW(y0) - 0.62) * side, y0, (monolithHalfW(y1) - 0.62) * side, y1, 0.025);
        }
        for (let y = 2; y < MONOLITH.h - 1; y += 0.75) {
          const major = Math.round(y / 0.75) % 4 === 0;
          line((monolithHalfW(y) - 0.46) * side, y, (monolithHalfW(y) - (major ? 0.92 : 0.72)) * side, y, 0.028);
        }
      }
    } else {
      // Border lines climbing into the break, so the ornament reads as part of something taller.
      const edge = stone.spec.w / 2 - 0.34;
      line(-edge, 0.2, -edge, stone.spec.h * 1.15, 0.05);
      line(edge, 0.2, edge, stone.spec.h * 1.15, 0.05);
      line(-edge + 0.16, 0.2, -edge + 0.16, stone.spec.h * 1.15, 0.025);
      line(edge - 0.16, 0.2, edge - 0.16, stone.spec.h * 1.15, 0.025);
      for (let y = 0.8; y < stone.spec.h * 1.15; y += 0.75) {
        line(-edge, y, -edge + 0.3, y, 0.028);
        line(edge, y, edge - 0.3, y, 0.028);
      }
    }
  }
  return canvas;
}

// Packs each stone's front face into the atlas: the monolith down the left, ruins in columns.
function allocateRects(stones) {
  let cursorX = 900;
  let cursorY = 8;
  let columnWidth = 0;
  for (const stone of stones) {
    if (stone.isMonolith) {
      const scale = (ATLAS_SIZE - 16) / (MONOLITH.h + 4);
      stone.rect = { x: 8, y: 8, scale, halfU: MONOLITH.w / 2 + 0.3, maxV: MONOLITH.h + 3 };
      continue;
    }
    const scale = 64;
    const widthPx = (stone.spec.w + 0.6) * scale;
    const maxV = stone.spec.h * 1.2;
    const heightPx = (maxV + 3.2) * scale;
    if (cursorY + heightPx > ATLAS_SIZE - 8) {
      cursorX += columnWidth + 8;
      cursorY = 8;
      columnWidth = 0;
    }
    stone.rect = { x: cursorX, y: cursorY, scale, halfU: stone.spec.w / 2 + 0.3, maxV };
    cursorY += heightPx + 8;
    columnWidth = Math.max(columnWidth, widthPx);
  }
}

// ── Shaders ───────────────────────────────────────────────────────────────────────

const VS = `${HEADER}
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec2 aUv;
layout(location=3) in vec3 aMat;
uniform mat4 uVP;
out vec3 vP;
out vec3 vN;
out vec2 vUv;
out vec3 vMat;
void main(){
  vP=aPos;
  vN=aNormal;
  vUv=aUv;
  vMat=aMat;
  gl_Position=uVP*vec4(aPos,1.);
}`;

const FS = `${HEADER}
in vec3 vP;
in vec3 vN;
in vec2 vUv;
in vec3 vMat;
out vec4 frag;
uniform vec3 uCam;
uniform sampler2D uAtlas;
uniform vec4 uLights[16];
uniform vec3 uLightCol[16];
uniform int uLightCount;
${WIND_GLSL}
${SKY_GLSL}
${TERRAIN_GLSL}
${SHADOW_GLSL}

float ggx(float NH,float a){
  float d=NH*NH*(a*a-1.)+1.;
  return a*a/(3.14159*d*d);
}

// One lobe of polish, as anisotropic GGX: how many microscopic facets face H, given how widely
// they spread along the stone (t) and around the curve (b).
float polishLobe(vec3 H,vec3 N,vec3 T,vec3 B,float t,float b){
  float x=dot(H,T)/t,y=dot(H,B)/b,z=max(dot(H,N),0.);
  float d=x*x+y*y+z*z;
  return 1./(3.14159*t*b*d*d);
}

// The scene's sun is kept modest so the sand doesn't burn out. Polish shows more of its real
// strength, by an amount set by eye.
const float SUN_IN_POLISH=55.;

void main(){
  float rough=vMat.x,orn=vMat.y,edge=vMat.z;
  vec3 Ng=normalize(vN);
  vec3 V=normalize(uCam-vP);

  // Hand-polished: the faces are very slightly wavy, so reflected horizons drift and bend.
  vec2 wave=vec2(texture(uNoise,vP.xy*.021+vP.z*.013).g,texture(uNoise,vP.xy*.021+.43-vP.z*.013).g)-.5;
  vec3 N=normalize(Ng+vec3(wave.x,wave.y*.7,wave.x*wave.y)*.028*(1.-rough));

  // A shallow central ridge splits the monolith's face in two, like a blade.
  if(edge>.5&&orn>.5) N=normalize(N+vec3(sign(vP.x)*smoothstep(0.,.05,abs(vP.x))*.055,0.,0.));

  // The monolith's rounded corners, rubbed by hand: the curve is never quite true, so whatever
  // it reflects wanders from side to side, and slides over those flaws as the viewer moves.
  float corner=0.;
  if(edge>.5&&rough<.5){
    vec2 nh=normalize(Ng.xz);
    corner=smoothstep(0.,.14,min(abs(nh.x),abs(nh.y)))*smoothstep(.7,.3,Ng.y);
    float around=vP.x+vP.z;
    float flaw=(texture(uNoise,vec2(vP.y*.02,around*.02)).r-.5)*.35+(texture(uNoise,vec2(vP.y*.08,around*.05+.37)).r-.5)*.1;
    N=normalize(N+cross(vec3(0.,1.,0.),Ng)*flaw*corner);
  }

  // Broken surfaces: fine conchoidal ripples over the flat chips.
  if(rough>.01){
    vec2 c=vec2(texture(uNoise,vP.xz*.17+vP.y*.11).g,texture(uNoise,vP.zx*.19-vP.y*.09).g)-.5;
    vec2 f=vec2(texture(uNoise,vP.xz*.83+vP.y*.61).g,texture(uNoise,vP.zx*.79-vP.y*.57).g)-.5;
    N=normalize(N+vec3(c.x,c.y*.6,c.y)*rough*.62+vec3(f.x,f.y*.3,f.y)*rough*.35);
  }

  float NV=max(dot(N,V),.001);
  float NL=max(dot(N,uSun),0.);
  float shadow=sunShadow(vP,max(dot(Ng,uSun),0.));
  float cloud=cloudSun(vP);

  vec3 R=reflect(-V,N);
  float fres=pow(1.-NV,5.);
  float F0=mix(.05,.07,rough);

  // Polished obsidian is close to a black mirror; broken faces scatter a soft sky sheen.
  vec3 env=rough>.5?mix(envColor(vP,normalize(R+Ng*.5),false),skyGradient(normalize(Ng+vec3(0.,.6,0.))),.5)
                   :envColor(vP,R,true);
  // Kept well below true Fresnel: at low viewing angles the real thing would read as silver.
  float glancing=F0+(1.-F0)*fres*.2;
  vec3 col=env*glancing*mix(1.,.72,rough);
  vec3 albedo=mix(vec3(.006,.006,.008),vec3(.024,.023,.03),rough);
  vec3 ambient=mix(vec3(.62,.42,.25)*.55,vec3(.43,.58,.92)*.68,.5+.5*Ng.y);
  vec3 sunCol=vec3(1.,.87,.68)*3.15;
  col+=albedo*(sunCol*NL*shadow*cloud+ambient);

  // A curve can sweep through more angle in one pixel than a highlight is wide. Widening the
  // highlight to the pixel keeps its light steady instead of letting it crawl and sparkle.
  vec3 dNx=dFdx(Ng),dNy=dFdy(Ng);
  float footprint=min((dot(dNx,dNx)+dot(dNy,dNy))*.5,.04);

  // Sharp sun glints off anything facing it just so.
  vec3 H=normalize(uSun+V);
  float NH=max(dot(N,H),0.);
  float HV=max(dot(H,V),0.);
  float fresH=F0+(1.-F0)*pow(1.-HV,5.);
  float a0=mix(.018,.32,rough);
  float spec=min(ggx(NH,sqrt(a0*a0+footprint))*fresH,80.);
  col+=sunCol*spec*NL*shadow*cloud*(1.-corner);

  // On the corners the rubbing runs around the curve, leaving facets that tilt up and down the
  // stone far more than from side to side. A vertical curve can barely mirror a sun this high,
  // so those tilted facets are what catch it, smearing it into a long, thin line. The line sits
  // where the curve faces halfway between viewer and sun, and it's brightest where the
  // reflection passes closest to the sun, thinning and fading away from there.
  if(corner>.001){
    vec3 T=normalize(vec3(0.,1.,0.)-N*N.y);
    vec3 B=cross(N,T);
    float rubbed=texture(uNoise,vec2(vP.y*.11,(vP.x+vP.z)*.2+.61)).g;
    float across=sqrt(pow(.012+.02*rubbed,2.)+footprint);
    float streak=.3*polishLobe(H,N,T,B,.14,across)+.7*polishLobe(H,N,T,B,.42,across);
    streak*=.6+.8*rubbed;
    col+=sunCol*SUN_IN_POLISH*streak*fresH*(.25/max(HV*HV,.1))*NL*shadow*cloud*corner;
  }

  // Settled sand: a dusting that thickens toward the ground and on upward-facing surfaces.
  float ground=terrainHeight(vP.xz);
  float dy=vP.y-ground;
  float dustN=texture(uNoise,vP.xy*.13+vP.z*.2).g;
  float dust=smoothstep(1.3,.0,dy+dustN*.7)*.6;
  // Only near-level surfaces hold loose sand, and the shards are too glassy to hold much.
  float settled=smoothstep(.9,.99,Ng.y)*smoothstep(.36,.62,texture(uNoise,vP.xz*.09).g);
  dust=max(dust,settled*mix(.25,.7,smoothstep(.5,.9,rough)));
  if(dust>.001){
    vec3 sand=vec3(.9,.63,.33)*(sunCol*NL*shadow*cloud+ambient*.95);
    col=mix(col,sand,dust);
  }

  // Inlaid engravings: dull gold that catches the sky, and carries light from woken stones.
  float line=orn>.5?texture(uAtlas,vUv).r:0.;
  vec3 glow=vec3(0.);
  for(int i=0;i<uLightCount;i++){
    vec3 d=vP-uLights[i].xyz;
    glow+=uLightCol[i]*uLights[i].w*exp(-dot(d,d)/9.);
  }
  if(line>.003){
    vec3 gold=vec3(.95,.62,.22);
    col=mix(col,gold*(.035+.075*env.b),line*.85*(1.-dust*.8));
    col+=glow*line*2.4;
  }
  // Active stones also sheen on the surrounding polish.
  col+=glow*(.035+.12*fres);

  vec3 toCam=uCam-vP;
  float dist=length(toCam);
  col=mix(col,hazeColor(-V,.06),1.-exp(-dist*.00017));
  frag=vec4(col,1.);
}`;

const DEPTH_VS = `${HEADER}

      const inView = Math.abs(dot(toStone, this.right)) < depth * tanX && Math.abs(dot(toStone, this.up)) < depth * tanY;
      if (depth > 1 && inView) nearest = Math.min(nearest, depth);
    }
    return Math.max(nearest, CLOSEST_LOOK);
  }

  // How far along a ray the first solid thing is, or null if it hits nothing.
  solidAlong(from, ray) {
    let nearest = null;
    for (const box of this.solids) {
      const t = rayBox(box, from, ray);
      if (t !== null && (nearest === null || t < nearest)) nearest = t;
    }
    return nearest;
  }

  // The depth to move at when a drag starts here, so that what's under the pointer follows it:
  // the stone at this point, or otherwise the closest stone in view.
  grabDepth(ndcX, ndcY) {
    if (this.mode !== 'pan') return 0;
    const ray = this.ray(ndcX, ndcY);
    const hit = this.solidAlong(this.eye, ray);
    return hit === null ? this.nearDepth : hit * dot(ray, this.forward);
  }

  // A one-finger or mouse drag across the screen, in pixels. Stones and sand stop it dead, with
  // no travel to win back when it reverses.
  drag(dx, dy, depth, viewHeight) {
    if (this.mode !== 'pan') {
      this.targetYaw = clamp(this.targetYaw - dx * 0.0032, -0.82, 0.82);
      this.targetLift = clamp(this.targetLift + dy * 0.03, 0, 13);
      return;
    }
    this.slide(dx, dy, depth, viewHeight);
    this.settle();
  }

  slide(dx, dy, depth, viewHeight) {
    this.gliding = false;
    const perPixel = (2 * depth * Math.tan(this.fovY / 2)) / viewHeight;
    this.aim = add(this.aim, add(scale(this.right, -dx * perPixel), scale(this.up, dy * perPixel)));
    this.followAim();
  }

  // Ends a gesture: the next one starts from where the eye actually is.
  settle() {
    this.aim = [...this.targetOffset];
  }

  // Zooms by `factor`: above 1 is closer. In pan mode it moves along the ray through the given
  // point, so whatever is under the pointer stays under it as it grows.
  zoom(factor, ndcX, ndcY) {
    if (this.mode !== 'pan') {
      this.targetDistance = clamp(this.targetDistance / factor, 26, 70);
      return;
    }
    this.gliding = false;
    const from = add(this.home, this.aim);
    const ray = this.ray(ndcX, ndcY);
    // Pointing at a stone closes in on that stone. Pointing at open sand or sky moves in proportion
    // to the closest stone in view, so one big pinch can't carry you past everything.
    const stone = this.solidAlong(from, ray);
    const distance = stone ?? this.closestStoneDepth(from) / dot(ray, this.forward);
    let move = distance * (1 - 1 / factor);
    if (stone !== null && factor > 1) move = Math.min(move, Math.max(stone - CLOSEST_LOOK, 0));
    // Stop at the near and far limits, rather than sliding sideways along them.
    const z = clamp(from[2] + ray[2] * move, PAN_NEAREST_Z, this.home[2] * PAN_FARTHEST);
    move = (z - from[2]) / ray[2];
    this.aim = add(this.aim, scale(ray, move));
    this.followAim();
  }

  // Sends the eye towards the aim, going around anything in the way. Only the eye gets bent, not
  // the aim, so a zoom that skirts a stone on its way past comes back onto its line afterwards.
  followAim() {
    const aim = add(this.home, this.aim);
    aim[0] = clamp(aim[0], -PAN_SIDE_LIMIT, PAN_SIDE_LIMIT);
    aim[1] = Math.min(aim[1], PAN_CEILING);
    aim[2] = clamp(aim[2], PAN_NEAREST_Z, this.home[2] * PAN_FARTHEST);
    this.aim = sub(aim, this.home);
    const eye = [...aim];
    // Twice, because rising clear of the sand can lift the eye back into a leaning stone.
    for (let pass = 0; pass < 2; pass++) {
      for (const box of this.solids) pushOutOfBox(box, eye, STONE_CLEARANCE);
      eye[1] = clamp(eye[1], this.terrain.sample(eye[0], eye[2]) + PAN_FLOOR, PAN_CEILING);
    }
    this.targetOffset = sub(eye, this.home);
  }

  // Whether the viewer has really moved from the opening view. The margins mean a slightly shaky
  // click doesn't count, and the camera's slow drift and pointer parallax aren't included at all.
  get awayFromHome() {
    if (this.mode === 'pan') {
      const [x, y, z] = this.targetOffset;
      return Math.hypot(x, y) > 0.5 || Math.abs(z) > 1.5;
    }
    return Math.abs(this.targetYaw) > 0.03 || this.targetLift > 0.4 || Math.abs(this.targetDistance - HOME_DISTANCE) > 1.5;
  }

  // Glides back to the opening view, on the camera's usual easing.
  recentre() {
    this.targetYaw = 0;
    this.targetLift = 0;
    this.targetDistance = HOME_DISTANCE;
    this.targetOffset = [0, 0, 0];
    this.aim = [0, 0, 0];
    this.gliding = true;
  }

  ray(ndcX, ndcY) {
    const m = this.invVP;
    const unproject = (x, y, z) => {
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      return [
        (m[0] * x + m[4] * y + m[8] * z + m[12]) / w,
        (m[1] * x + m[5] * y + m[9] * z + m[13]) / w,
        (m[2] * x + m[6] * y + m[10] * z + m[14]) / w,
      ];
    };
    return normalize(sub(unproject(ndcX, ndcY, 1), this.eye));
  }
}

function buildShadowMap(gl, draw) {
  const depth = createTexture(gl, {
    width: SHADOW_SIZE,
    height: SHADOW_SIZE,
    internalFormat: gl.DEPTH_COMPONENT24,
    format: gl.DEPTH_COMPONENT,
    type: gl.UNSIGNED_INT,
  });
  gl.bindTexture(gl.TEXTURE_2D, depth);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  gl.bindTexture(gl.TEXTURE_2D, null);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depth, 0);
  gl.drawBuffers([gl.NONE]);
  gl.readBuffer(gl.NONE);
  checkFramebuffer(gl, 'shadow');

  const eye = SUN.map((v) => v * 1100);
  const view = lookAt(eye, [0, 0, 0], [0, 1, 0]);
  const proj = ortho(-SHADOW_EXTENT, SHADOW_EXTENT, -SHADOW_EXTENT, SHADOW_EXTENT, 300, 1900);
  const vp = multiply(proj, view);

  gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
  gl.clearDepth(1);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  draw(vp);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fbo);
  return { depth, vp };
}

// Finds the rune or gem under a screen point, if any is both close enough and unobstructed.
function pick(ndcX, ndcY, camera, elements, boxes, viewportHeight) {
  const ray = camera.ray(ndcX, ndcY);
  const pixelsPerNdc = viewportHeight / 2;
  const pxPerRadian = viewportHeight / (2 * Math.tan(camera.fovY / 2));
  const aspect = canvas.clientWidth / canvas.clientHeight;
  let best = null;
  let bestScore = Infinity;
  for (const e of elements) {
    const toEye = sub(camera.eye, e.position);
    if (toEye[0] * e.normal[0] + toEye[1] * e.normal[1] + toEye[2] * e.normal[2] < 0) continue;
    const c = project(camera.vp, e.position);
    if (c[3] <= 0) continue;
    const dx = (c[0] - ndcX) * aspect * pixelsPerNdc;
    const dy = (c[1] - ndcY) * pixelsPerNdc;
    const distance = Math.hypot(dx, dy);
    const radius = Math.max(((e.size * 1.35) / c[3]) * pxPerRadian, 13);
    if (distance > radius) continue;
    const score = distance / radius;
    if (score >= bestScore) continue;
    if (isHidden(e, c[3], ray, camera.eye, boxes)) continue;
    best = e;
    bestScore = score;
  }
  return best;
}

function isHidden(element, elementDistance, ray, eye, boxes) {
  for (const box of boxes) {
    const t = rayBox(box, eye, ray, box.coverY);
    if (t !== null && t < elementDistance - 1.2) return true;
  }
  return false;
}

// A point in a stone's own coordinates: across, up and out from its face.
const toBoxSpace = ({ P }, v) => [dot(v, P.right), dot(v, P.up), dot(v, P.forward)];

// How far along a ray it enters a box, or null if it misses or starts inside.
function rayBox(box, from, ray, top = box.maxY) {
  const o = toBoxSpace(box, sub(from, box.P.position));
  const d = toBoxSpace(box, ray);
  const lo = [-box.halfX, box.minY, -box.halfZ];
  const hi = [box.halfX, top, box.halfZ];
  let tNear = -Infinity;
  let tFar = Infinity;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(d[i]) < 1e-6) {
      if (o[i] < lo[i] || o[i] > hi[i]) return null;
    } else {
      const a = (lo[i] - o[i]) / d[i];
      const b = (hi[i] - o[i]) / d[i];
      tNear = Math.max(tNear, Math.min(a, b));
      tFar = Math.min(tFar, Math.max(a, b));
    }
  }
  return tNear <= tFar && tNear > 0 ? tNear : null;
}

// Moves a point out through the nearest side or top of a box, if it's within `margin` of it.
function pushOutOfBox(box, point, margin) {
  const { P } = box;
  const [x, y, z] = toBoxSpace(box, sub(point, P.position));
  const sideways = box.halfX + margin - Math.abs(x);
  const upwards = box.maxY + margin - y;
  const outwards = box.halfZ + margin - Math.abs(z);
  if (sideways <= 0 || upwards <= 0 || outwards <= 0) return;
  // The shortest way out, except downward: under a leaning stone, that only leads into the sand.
  const ways = [scale(P.forward, z < 0 ? -outwards : outwards), scale(P.right, x < 0 ? -sideways : sideways), scale(P.up, upwards)];
  const open = ways.filter((way) => way[1] > -0.2 * Math.hypot(...way));
  const push = open.reduce((best, way) => (Math.hypot(...way) < Math.hypot(...best) ? way : best));
  for (let i = 0; i < 3; i++) point[i] += push[i];
}

async function boot() {
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  if (!gl) return failure('This piece needs WebGL 2, which this browser does not offer.');
  if (!gl.getExtension('EXT_color_buffer_float')) {
    return failure('This piece needs floating-point render targets, which this graphics driver does not offer.');
  }
  gl.getExtension('OES_texture_float_linear');

  const noise = createNoiseTexture(gl);
  const terrain = new Terrain(gl, obstaclesFromLayout());
  const started = performance.now();
  await terrain.generate((p) => {
    veilText.textContent = p < 0.3 ? 'The sands are settling' : p < 0.6 ? 'The dunes are rising' : 'The horizon is forming';
  });
  await new Promise((resolve) => setTimeout(resolve));
  const backdrop = new Backdrop(gl);
  const stones = new Stones(gl, terrain);
  const { elements, boxes } = stones;
  const runes = new Runes(gl, elements);
  const dust = new Dust(gl, terrain, WIND);
  const insects = new Insects(gl, terrain, elements, SUN);
  const instrument = new Instrument(elements);
  const autoplay = new Autoplay(instrument, elements);
  const orrery = new Orrery(gl, stones.orreryPlacement, autoplay);
  const dial = { P: stones.orreryPlacement, halfX: 1.4, minY: -1.4, maxY: 1.4, halfZ: 0.5 };
  const camera = new Camera(terrain, CAMERA_MODE, boxes, [...boxes, dial]);
  const post = new Post(gl);

  const shadow = buildShadowMap(gl, (vp) => {
    terrain.drawDepth(vp);
    stones.drawDepth(vp);
  });
  console.info(`World generated in ${Math.round(performance.now() - started)} ms`);

  // ── Resolution ────────────────────────────────────────────────────────────────
  // Quality ladder, walked by measured cost: multisampling goes first, then resolution.
  const QUALITY = [
    { scale: 1, samples: post.samples },
    { scale: 1, samples: 0 },
    { scale: 0.86, samples: 0 },
    { scale: 0.74, samples: 0 },
    { scale: 0.62, samples: 0 },
    { scale: 0.5, samples: 0 },
  ];
  let qualityLevel = 0;
  let renderScale = 1;
  let canvasW = 0;
  let canvasH = 0;
  let lastSamples = post.samples;
  const MAX_PIXELS = 3_900_000;
  const fit = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(2, Math.round(canvas.clientHeight * dpr));
    if (w !== canvasW || h !== canvasH) {
      canvasW = w;
      canvasH = h;
      canvas.width = w;
      canvas.height = h;
    }
    const budget = Math.min(1, Math.sqrt(MAX_PIXELS / (w * h)));
    const scale = budget * renderScale;
    post.resize(Math.max(2, Math.round(w * scale)), Math.max(2, Math.round(h * scale)), lastSamples);
  };
  window.addEventListener('resize', fit);
  fit();
  const setQuality = (level) => {
    qualityLevel = clamp(level, 0, QUALITY.length - 1);
    renderScale = QUALITY[qualityLevel].scale;
    lastSamples = QUALITY[qualityLevel].samples;
    fit();
  };

  // GPU time is the honest measure: frame intervals also change when a browser throttles a
  // covered window or a hidden pane, which says nothing about this machine's speed.
  const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  const timerPending = [];
  let gpuTotal = 0;
  let gpuCount = 0;
  const readTimers = () => {
    while (timerPending.length && gl.getQueryParameter(timerPending[0], gl.QUERY_RESULT_AVAILABLE)) {
      const query = timerPending.shift();
      if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) {
        gpuTotal += gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6;
        gpuCount++;
      }
      gl.deleteQuery(query);
    }
  };

  // ── Input ─────────────────────────────────────────────────────────────────────
  const pointers = new Map();
  let hovered = null;
  let lastWheel = -Infinity;
  let landedGap = 0;
  const refreshRecentre = () => {
    const away = camera.awayFromHome;
    recentreButton.classList.toggle('shown', away);
    // Moving the view means they've found the hint's last tip, and on a narrow screen it would
    // otherwise sit underneath this button.
    if (away) hint.classList.add('gone');
  };
  const toNdc = (ev) => {
    const r = canvas.getBoundingClientRect();
    return [((ev.clientX - r.left) / r.width) * 2 - 1, 1 - ((ev.clientY - r.top) / r.height) * 2];
  };
  const pickAt = (ev) => {
    const [x, y] = toNdc(ev);
    return pick(x, y, camera, elements, boxes, canvas.clientHeight);
  };
  const overOrrery = (ev) => {
    const [x, y] = toNdc(ev);
    return orrery.hit(camera.eye, camera.ray(x, y));
  };
  canvas.addEventListener('pointerdown', (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const [nx, ny] = toNdc(ev);
    const depth = camera.grabDepth(nx, ny);
    // A finger joining a drag has come to pinch, so it shouldn't play whatever it lands on.
    if (camera.mode === 'pan' && [...pointers.values()].some((p) => !p.playing && !p.onOrrery)) {
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, playing: false, depth });
      return;
    }
    // The orrery stands in front of everything else, so it gets first refusal.
    if (overOrrery(ev)) {
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, onOrrery: true });
      instrument.ensureAudio();
      autoplay.toggle();
      hint.classList.add('gone');
      return;
    }
    const element = pickAt(ev);
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, playing: !!element, last: element, depth });
    if (element) {
      instrument.press(element);
      hint.classList.add('gone');
    }
    if (pointers.size === 2) {
      const [a, b] = pointers.values();
      landedGap = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener('pointermove', (ev) => {
    const [nx, ny] = toNdc(ev);
    // When dragging moves the view directly, the pointer can't also be nudging it.
    if (camera.mode !== 'pan' || !pointers.size) camera.parallax = [nx, ny];
    const state = pointers.get(ev.pointerId);
    if (!state) {
      if (ev.pointerType === 'mouse') {
        orrery.hovering = overOrrery(ev);
        hovered = orrery.hovering ? null : pickAt(ev);
        canvas.style.cursor = hovered || orrery.hovering ? 'pointer' : 'grab';
      }
      return;
    }
    const dx = ev.clientX - state.x;
    const dy = ev.clientY - state.y;
    // Every finger keeps its position up to date, because a pinch measures between two of them.
    state.x = ev.clientX;
    state.y = ev.clientY;
    if (state.onOrrery) return;
    // Two fingers on gems are playing them, until they spread or close: then it's a pinch after all.
    // Up close gems are big, and otherwise a pinch that lands on two of them would never zoom.
    if (camera.mode === 'pan' && state.playing && pointers.size === 2) {
      const [a, b] = pointers.values();
      if (a.playing && b.playing && Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - landedGap) > 18) a.playing = b.playing = false;
    }
    if (state.playing) {
      const element = pickAt(ev);
      if (element && element !== state.last) instrument.strum(element);
      state.last = element ?? state.last;
      return;
    }
    if (pointers.size === 1) {
      camera.drag(dx, dy, state.depth, canvas.clientHeight);
      canvas.style.cursor = 'grabbing';
    } else if (pointers.size === 2) {
      const others = [...pointers.entries()].filter(([id]) => id !== ev.pointerId);
      const other = others[0][1];
      const before = Math.hypot(ev.clientX - dx - other.x, ev.clientY - dy - other.y);
      const after = Math.hypot(ev.clientX - other.x, ev.clientY - other.y);
      const [mx, my] = toNdc({ clientX: (ev.clientX + other.x) / 2, clientY: (ev.clientY + other.y) / 2 });
      camera.zoom(Math.max(after, 1) / Math.max(before, 1), mx, my);
      // Two fingers moving together slide the view as they pinch. In pan mode that matters up
      // close, where a stone can fill the screen with little sand left to drag.
      if (camera.mode === 'pan') camera.slide(dx / 2, dy / 2, camera.grabDepth(mx, my), canvas.clientHeight);
    }
    refreshRecentre();
  });
  const endPointer = (ev) => {
    pointers.delete(ev.pointerId);
    camera.settle();
    // The view may have changed since any remaining finger landed, so it needs a fresh grip.
    for (const p of pointers.values()) {
      const [nx, ny] = toNdc({ clientX: p.x, clientY: p.y });
      p.depth = camera.grabDepth(nx, ny);
    }
    if (ev.pointerType === 'mouse') canvas.style.cursor = hovered || orrery.hovering ? 'pointer' : 'grab';
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => {
    if (!pointers.size) {
      hovered = null;
      orrery.hovering = false;
    }
  });
  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const [nx, ny] = toNdc(ev);
    // A pause between wheel steps ends that gesture.
    if (ev.timeStamp - lastWheel > 300) camera.settle();
    lastWheel = ev.timeStamp;
    // Trackpad pinches arrive as small wheel steps with the control key flagged.
    const rate = camera.mode !== 'pan' ? 0.0009 : ev.ctrlKey ? 0.008 : 0.002;
    camera.zoom(Math.exp(-ev.deltaY * rate), nx, ny);
    refreshRecentre();
  }, { passive: false });
  recentreButton.addEventListener('click', () => {
    camera.recentre();
    refreshRecentre();
  });

  // Browsers hold audio back until a real gesture, so any touch or key starts the wind, even one
  // that misses every stone. Touch screens only count the release as a gesture, hence pointerup.
  for (const type of ['pointerdown', 'pointerup', 'keydown']) {
    window.addEventListener(type, () => instrument.ensureAudio());
  }

  // Stilling the stones stops the orrery too, or it would only start them up again. It stays on
  // offer while the orrery runs, even in a gap between notes.
  const refreshHush = () => hushButton.classList.toggle('shown', instrument.activeCount > 0 || autoplay.enabled);
  instrument.onActivity = refreshHush;
  const still = () => {
    instrument.hush();
    autoplay.stop();
  };
  hushButton.addEventListener('click', still);
  window.addEventListener('keydown', (ev) => {
    // In fullscreen, Esc is the browser's way out, and shouldn't silence everything as well.
    if (ev.key === 'Escape' && !isFullscreen()) still();
  });

  document.getElementById('hint-move').textContent = MOVE_HINT[CAMERA_MODE];

  // ── Frame ─────────────────────────────────────────────────────────────────────
  const lightPos = new Float32Array(16 * 4);
  const lightCol = new Float32Array(16 * 3);
  let previous = performance.now();
  let elapsed = 0;
  let slowWindows = 0;
  let fastWindows = 0;
  let sampleFrames = 0;
  let frameTimeTotal = 0;
  let settleTime = 3; // Shader warm-up and page load don't count against the machine.
  const debug = { fps: 0, gpuMs: 0, level: 0, setQuality };

  const adaptQuality = (rawDt, dt) => {
    if (settleTime > 0 || document.hidden) {
      settleTime -= dt;
      gpuTotal = 0;
      gpuCount = 0;
      return;
    }
    frameTimeTotal += rawDt;
    sampleFrames++;
    if (frameTimeTotal < 2) return;
    debug.fps = sampleFrames / frameTimeTotal;
    let slow;
    let fast = false;
    if (timerExt && gpuCount > 0) {
      debug.gpuMs = gpuTotal / gpuCount;
      slow = debug.gpuMs > 27;
      fast = debug.gpuMs < 8;
    } else {
      // No GPU timer here. Going by frame rate: stay above 25 fps, ignoring throttled windows.
      slow = debug.fps < 25 && debug.fps > 4;
    }
    slowWindows = slow ? slowWindows + 1 : 0;
    fastWindows = fast ? fastWindows + 1 : 0;
    if (slowWindows >= 2 && qualityLevel < QUALITY.length - 1) {
      slowWindows = 0;
      setQuality(qualityLevel + 1);
    } else if (fastWindows >= 3 && qualityLevel > 0) {
      fastWindows = 0;
      setQuality(qualityLevel - 1);
    }
    debug.level = qualityLevel;
    frameTimeTotal = 0;
    sampleFrames = 0;
    gpuTotal = 0;
    gpuCount = 0;
  };

  const frameLoop = (nowMs) => {
    const rawDt = (nowMs - previous) / 1000;
    const dt = Math.min(0.1, rawDt);
    previous = nowMs;
    elapsed += dt;
    adaptQuality(rawDt, dt);

    let timerQuery = null;
    if (timerExt) {
      readTimers();
      // Only one frame is ever in flight, so a slow readback can't pile up queries.
      if (timerPending.length < 4) {
        timerQuery = gl.createQuery();
        gl.beginQuery(timerExt.TIME_ELAPSED_EXT, timerQuery);
      }
    }

    const aspect = canvasW / canvasH;
    camera.update(dt, elapsed, aspect);
    // Real time, not animation time: a gem's light must end with its sound even if frames stall.
    instrument.update(Math.min(rawDt, 1), nowMs / 1000);
    runes.update();
    orrery.update(dt, nowMs / 1000, (point, color) => {
      for (let i = 0; i < 3; i++) dust.spark(point, color, 0.7);
    });

    for (const e of elements) {
      const target = hovered === e ? 1 : 0;
      e.hover += (target - e.hover) * (1 - Math.exp(-dt / 0.09));
      if (e.activity > 0.06) {
        const rate = 3 + e.size * 9;
        if (Math.random() < rate * e.activity * dt) dust.spark(e.position, e.color);
      }
    }

    const glowing = elements.filter((e) => e.glow > 0.02).sort((a, b) => b.glow - a.glow).slice(0, 16);
    glowing.forEach((e, i) => {
      lightPos.set([...e.position, e.glow * (0.6 + e.size)], i * 4);
      lightCol.set(e.color, i * 3);
    });

    const gust = gustAt(elapsed);
    dust.update(dt, elapsed, camera.eye, gust);
    insects.update(dt, elapsed, { eye: camera.eye, yaw: camera.effectiveYaw }, elements);

    const frame = {
      uVP: camera.vp,
      uInvVP: camera.invVP,
      uCam: camera.eye,
      uSun: SUN,
      uTime: elapsed % 10800,
      uWind: WIND,
      uNoise: noise,
      uNearFar: [NEAR, FAR],
      uCamRight: camera.right,
      uCamUp: camera.up,
      uShadow: shadow.depth,
      uSunVP: shadow.vp,
      uShadowTexel: 1 / SHADOW_SIZE,
      ...terrain.bindings(),
    };

    post.beginScene();
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    stones.draw(frame, { uLights: lightPos, uLightCol: lightCol, uLightCount: glowing.length });
    runes.drawGems(frame);
    orrery.draw(frame);
    terrain.draw(frame);
    backdrop.drawMountains(frame);
    backdrop.drawSky(frame);
    runes.drawDecals(frame);
    insects.draw(frame);

    post.endScene();
    dust.draw(frame, post.depthTex);
    post.present(canvasW, canvasH, frame);

    if (timerQuery) {
      gl.endQuery(timerExt.TIME_ELAPSED_EXT);
      timerPending.push(timerQuery);
    }
    requestAnimationFrame(frameLoop);
  };

  // The sand's hiss follows the visible gusts. This runs on a timer rather than in the frame
  // loop because frames stop in a hidden tab, and the sound shouldn't stick mid-gust when they do.
  setInterval(() => {
    instrument.setGust(gustAt(elapsed + (performance.now() - previous) / 1000));
  }, 100);
  // A timer for the same reason: the orrery should keep playing while its tab is hidden.
  setInterval(() => autoplay.tick(), 50);

  veil.classList.add('gone');
  hint.classList.add('shown');
  requestAnimationFrame((t) => {
    previous = t;
    frameLoop(t);
  });

  // Handy from the browser console.
  window.monolith = { instrument, autoplay, orrery, elements, camera, insects, debug, gustAt, get time() { return elapsed; }, setTime(t) { elapsed = t; } };
}

const isFullscreen = () => !!(document.fullscreenElement ?? document.webkitFullscreenElement);

// On offer whenever the page isn't fullscreen, from the moment it loads. It stays hidden where
// the browser can't do it, as a button that does nothing is worse than none.
function setUpFullscreen() {
  const button = document.getElementById('fullscreen');
  const page = document.documentElement;
  const enter = page.requestFullscreen ?? page.webkitRequestFullscreen;
  if (!enter || !(document.fullscreenEnabled ?? document.webkitFullscreenEnabled)) return;
  const refresh = () => button.classList.toggle('shown', !isFullscreen());
  document.addEventListener('fullscreenchange', refresh);
  document.addEventListener('webkitfullscreenchange', refresh);
  button.addEventListener('click', async () => {
    try {
      await enter.call(page);
    } catch (error) {
      console.warn('Fullscreen refused:', error);
    }
  });
  refresh();
}

setUpFullscreen();

boot().catch((error) => {
  console.error(error);
  failure('The desert could not be drawn on this device. The console has the details.');
});

return {  };
})();
</script>
